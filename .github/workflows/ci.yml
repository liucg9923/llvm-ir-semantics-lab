name: Core and dataset checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: irsem check-lock
      - run: python -c "from pathlib import Path; from irsem.gguf import check_supplement; check_supplement(Path.cwd())"
      - run: python scripts/verify_evidence.py results/published/experiment-v2/evidence/experiment-evidence.tar.gz
      - run: python scripts/verify_evidence.py results/published/compiler-ftd-v1/evidence/experiment-evidence.tar.gz
      - run: python scripts/verify_comparison.py results/published/compiler-ftd-v1
# Native LLVM/Alive2 acceptance is intentionally a separate cloud deployment step.
# This CPU-only workflow never downloads weights or uses model-access secrets.
